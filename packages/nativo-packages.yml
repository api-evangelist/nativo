name: Nativo
summary: >-
  Nativo publishes first-party mobile ad SDKs for iOS, Android and React Native. There is NO
  first-party client library for the Nativo API V3 (REST/reporting) in any registry — npm, PyPI,
  RubyGems, crates.io, Packagist, pkg.go.dev and NuGet were all searched and returned nothing
  first-party. The Android SDK is not on Maven Central; it is served from Nativo's own Artifactory
  instance at nativo.jfrog.io, which is why a Maven Central search for net.nativo.sdk returns zero.
