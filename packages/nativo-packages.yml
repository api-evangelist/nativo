  docs: https://sdk.nativo.com/docs/cocoapods-integration
  note: >-
    CocoaPods trunk lists 50 published versions, owner mmurray@nativo.com — first-party. Latest
    trunk release 7.2.1 (2024-09-20) matches the newest entry in Nativo's own iOS release notes
    (v7.2.1 - Sep 20th, 2024), so the pod is current with the documented iOS SDK line but has had
