- aid: nativo-ad-serving-api
  name: Nativo Ad Serving API (BETA)
  description: >-
    A BETA GET endpoint that returns a Nativo native display ad as a programmatic response so a
    publisher can render the ad in its own technology rather than through the Nativo tag or SDK.
    The request requires page_url and user_agent query parameters (plus visitor_id and user_ip in
    the published examples); the site being rendered on must already exist in the Nativo system.
    The API is unversioned and access is granted by a Nativo CSM.
  humanURL: https://api-docs.nativo.com/reference/ad-serving-api
  baseURL: https://jadserve.postrelease.com/adsver/api
