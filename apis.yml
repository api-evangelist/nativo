apis:
- aid: nativo-api-v3
  name: Nativo API V3
  description: >-
    The Nativo API V3 is the platform REST API for the Nativo advertising platform. It exposes
    CRUD trafficking resources (advertisers, campaigns, budgets, ads, creatives, placements,
    targeting parameters, tracking parameters and site-target search) and six reporting resources
    (direct campaigns, preferred campaigns, marketplace campaigns, demand, auction and inventory)
    that accept a shared report payload of start_date/end_date, timezone, resolution, metrics,
    breakdown and filters. Requests are authenticated with a per-user Personal Access Token sent as
    an HTTP Bearer credential, and every response is wrapped in a status / status_code / messages /
    data envelope.
  humanURL: https://api-docs.nativo.com/reference/general
  baseURL: https://api.nativo.com/v3
