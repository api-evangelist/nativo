aid: nativo
name: Nativo
description: >-
  Nativo is a native advertising and content-distribution technology company (El Segundo, California)
  that runs a native ad exchange and licenses a white-label ad server used by publishers to sell and
  serve sponsored content, native display, native video and story ad formats across a network of more
  than 20,000 apps and sites. Its platform spans an SSP, a curation marketplace, a self-serve buying
  console, a SaaS ad renderer, and the SPARC and Brand Rank products. Nativo was acquired by Life360
  and the acquisition closed on 5 January 2026; the corporate site now resolves to ads.life360.com
  ("Life360 Ads featuring Nativo"), while the developer surface remains on nativo.com hosts. The
  public developer surface is a REST Nativo API V3 at api.nativo.com/v3 covering advertisers,
  campaigns, budgets, ads, creatives, placements, targeting and six reporting resources; a BETA
  Ad Serving API on jadserve.postrelease.com; and first-party mobile ad SDKs for iOS, Android and
  React Native.
