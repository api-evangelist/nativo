- from: Placement
  to: Section
  type: belongs_to
  via: section_id
  note: >-
    Section is referenced by id but has no published CRUD endpoint in the API V3 reference; it is
    the SDK-side unit (initSectionWithAdapter takes a section URL key).
- from: Budget
  to: SiteTarget
  type: has_many
  via: 'targeting / placements objects, populated from GET /v3/search/targeting/sites/{entity}'
- from: ArticlePreviewLink
  to: Campaign
  type: belongs_to
  via: 'campaign_id path parameter'
- from: ArticlePreviewLink
  to: Creative
  type: belongs_to
  via: creative_id
hierarchy: 'Advertiser -> Campaign -> Budget -> Ad -> Creative'
