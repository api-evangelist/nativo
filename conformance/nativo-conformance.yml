      BOTH: 30
    contact_email: rtbsupport@nativo.com
    contact_address: 'Nativo, Inc., 100 N. Pacific Coast Highway, 10th Floor, El Segundo, CA 90245'
  note: >-
    Redirect chain probed 2026-08-26: https://nativo.com/sellers.json -> 301 ->
    https://iab.nativo.com/sellers.json, 200, 160,132 bytes.
- id: tag-registration
  name: Trustworthy Accountability Group (TAG) registration
  conforms: true
  evidence:
    url: https://iab.nativo.com/sellers.json
    field: 'identifiers[0] = { name: TAG-ID, value: 59521ca7cc5e9fee }'
  note: A TAG-ID is only issued to a company that has completed TAG registration.
- id: iab-gpp
  name: IAB Global Privacy Platform (GPP)
  conforms: true
  evidence:
    url: https://sdk.nativo.com/docs/consent-management
    detail: >-
      "Starting with v7.2.1 for iOS and v7.2.3 for Android, the Nativo SDK supports the GPP."
      Consent is transmitted to the ad server as the ntv_gpp_consent query parameter on
      https://jadserve.postrelease.com/sdk/config.
- id: iab-tcf
  name: IAB Europe Transparency & Consent Framework (GDPR TCF)
  conforms: true
  evidence:
    url: https://sdk.nativo.com/docs/consent-management
    detail: >-
      SDK reads the IABTCF_TCString shared preference written by any IAB-compliant CMP and passes
      it through as ntv_gdpr_consent.
- id: iab-us-privacy
  name: IAB CCPA / US Privacy String
  conforms: true
  evidence:
    url: https://sdk.nativo.com/docs/consent-management
    detail: >-
      SDK reads IABUSPrivacy_String and forwards it as the us_privacy parameter (documented
      example value 1YNN).
- id: iab-open-measurement
  name: IAB Tech Lab Open Measurement SDK
  version: 1.5.4
  conforms: true
  evidence:
    url: https://sdk.nativo.com/docs/releases-android
    detail: 'Android SDK v7.2.5 (2025-03-10): "Updated IAB Open Measurement SDK to v1.5.4".'
- id: vast
  name: IAB VAST (video ad serving)
  conforms: true
  evidence:
    url: https://sdk.nativo.com/docs/releases-ios
    detail: >-
      VAST video support is provided through the Google Interactive Media Ads SDK, updated to
      v3.23 in iOS SDK v7.2.1. Listed as an optional CocoaPods dependency
      (pod 'GoogleAds-IMA-iOS-SDK').
- id: prebid
  name: Prebid / Prebid Server header bidding
  conforms: true
  evidence:
    url: https://github.com/life360-oss
    detail: >-
      The public org that now holds the Nativo SDK repositories also carries forks of
      prebid-server, prebid-server-java, prebid.github.io, PrebidNativoBidder, and the
      life360-ads-sdk-android / life360-ads-sdk-ios Prebid Mobile SDKs. PrebidNativoBidder is a
      Nativo bidder adapter for Prebid.js.
  confidence: high
- id: app-ads-txt
  name: IAB Tech Lab app-ads.txt
  conforms: true
  role: consumer / publisher guidance
  evidence:
    url: https://sdk.nativo.com/docs/mobile-app-adstxt
    detail: >-
      Nativo publishes a "Mobile app-ads.txt" guide instructing app publishers how to declare
      Nativo as an authorised seller.
  note: >-
    Nativo does NOT serve its own /ads.txt or /app-ads.txt — probed 2026-08-26,
    https://nativo.com/ads.txt and https://nativo.com/app-ads.txt both 404 (they land on the
    Webflow 404 at ads.life360.com). This is expected: Nativo is the seller side, so sellers.json
    is the file it is obliged to publish, and it does.
- id: openrtb
  name: IAB Tech Lab OpenRTB
  conforms: unverified
  evidence:
    detail: >-
      Nativo markets an SSP/exchange and its status page lists an "SSP/Exchange" component, and a
      sellers.json is only meaningful inside an OpenRTB supply chain — but no OpenRTB request or
      response contract, version, or endpoint is published on any public Nativo surface.
      Recorded as unverified rather than true; do not credit it without a published contract.
