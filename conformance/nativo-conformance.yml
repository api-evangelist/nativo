name: Nativo
summary: >-
  Nativo conforms to almost none of the generic API standards a scorer looks for — no OAuth 2.0,
  no OIDC, no RFC 9457, no JSON:API, no idempotency, no OData/SCIM. What it DOES conform to is the
  standards stack of its own market: the IAB Tech Lab ad-tech specifications. It publishes a
  machine-readable sellers.json (939 sellers), is TAG-registered, ships IAB GPP / TCF / US Privacy
  consent plumbing in its SDKs, embeds the IAB Open Measurement SDK, and maintains public forks of
  Prebid Server and Prebid Mobile. That is a genuine domain-standard posture, and it is the only
  machine-readable contract Nativo publishes anywhere.
domain: advertising-technology
domain_standard_conformance:
  present: true
  primary: IAB Tech Lab sellers.json 1.0
  evidence_artifact: conformance/nativo-sellers.json
  note: >-
    sellers.json is the strongest signature here: a versioned, machine-readable document served
    from a host Nativo controls, whose schema is defined by the IAB Tech Lab and which every
    programmatic buyer in the market parses. It is served for nativo.com, www.nativo.com AND
    ads.life360.com — all three 301 to iab.nativo.com/sellers.json — which also confirms the
    Life360 property inherits the Nativo seller identity rather than declaring its own.
