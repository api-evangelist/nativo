corporate_lifecycle:
  event: acquisition
  acquirer: Life360, Inc.
  announced: '2025-11-10'
  closed: '2026-01-05'
  consideration: approximately USD 120 million (65% cash / 35% stock, per Life360 IR)
  effects_observed:
  - >-
    nativo.com and www.nativo.com now 301 to https://ads.life360.com/ ("Life360 Ads featuring
    Nativo"); developers.nativo.com resolves to ads.life360.com/developers.
  - >-
    The public GitHub organisation moved: github.com/NativoPlatform now 302s to a Life360
    enterprise-managed-user SSO sign-in, and the sample-app repositories redirect to
    github.com/life360-oss. Nativo's own SDK docs still link the old NativoPlatform URLs.
  - >-
    The API hosts were NOT migrated — api.nativo.com, api-docs.nativo.com, sdk.nativo.com,
    admin.nativo.com, status.nativo.com and iab.nativo.com all remain on nativo.com.
  source: https://ads.life360.com/newsroom/life360-to-acquire-nativo
