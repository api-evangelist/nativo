name: Nativo
summary: >-
  Nativo runs a path-versioned API (V3 current, V2 docs still published) with a narrow, explicitly
  scoped deprecation policy: the API surface itself changes "mostly backward-compatibly", and the
  ONLY things Nativo reserves the right to deprecate are the option sets on the reporting
  metrics, breakdown and filters parameters. A concrete list of already-removed metrics is
  published for the Marketplace Campaigns resource. There is no Sunset/Deprecation header
  (RFC 8594), no published sunset dates, no SLA and no public roadmap.
versioning:
  scheme: path
  current_version: v3
  current_base: https://api.nativo.com/v3
  previous_versions:
  - version: v2
    docs: https://api-docs.nativo.com/v2.0/
    status: documentation still published; no sunset date announced
  statement: >-
    "Version 3 is the current version of the Nativo API. To access the V2 documentation see here."
  compatibility: >-
    "We periodically add resources, or increase the amount of data available for existing
    resources. This is done in a mostly backward-compatible manner."
  unversioned_surfaces:
  - api: Nativo Ad Serving API (BETA)
    statement: >-
      "Does the Ad Serving API use versioning? Currently No, but future version of the API may
      support versioning."
deprecation_policy:
  published: true
  url: https://api-docs.nativo.com/reference/general
  scope: >-
    Explicitly limited. "The only exception are options available for the metrics, breakdown, and
    filters parameters of Reporting resources. These are subject to deprecation. To see the latest
    set of available options, see the reference page for each parameter."
  mechanism: >-
    Removal is communicated by the option disappearing from the parameter reference page, plus a
    "Deprecated Metrics" section on the affected resource page. There is no changelog entry, no
    email notice described, and no advance-notice period stated.
  notice_period: not stated
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_items:
  - resource: Marketplace Campaigns (POST /data/marketplace)
    url: https://api-docs.nativo.com/reference/marketplace-campaigns
    removed_metrics:
    - companion_asset_clicks
    - page_views_rate
    - publisher_ecpm
    - publisher_cpm
    - vtr
    statement: >-
      "The following metrics are no longer available for the Marketplace Campaigns resource."
    note: >-
      Stated as already removed, not as pending removal — no date is given for when they went away.
  agent_note: >-
    Because the deprecation surface is a set of enum VALUES rather than operations, an agent cannot
    detect a deprecation from a spec diff or a response header. The only detection path is a 400
    Bad Request on a metric that used to work.
beta_surfaces:
