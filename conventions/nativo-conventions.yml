  errors: errors/nativo-problem-types.yml
  lifecycle: lifecycle/nativo-lifecycle.yml
  authentication: authentication/nativo-authentication.yml
  rate_limits: rate-limits/nativo-rate-limits.yml
  data_model: data-model/nativo-data-model.yml
